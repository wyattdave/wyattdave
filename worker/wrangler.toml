name = "wyattdave-chatbot"
main = "src/index.js"
compatibility_date = "2025-04-01"

# Don't auto-glob extra files into the bundle — only what's imported from main.
find_additional_modules = false
no_bundle = false

# Bundle prompt.md as a text module so it ships with the Worker.
# Restricted to this single file; do NOT widen this glob (it will hoover up
# every .md in the repo if you do).
rules = [
    { type = "Text", globs = ["**/prompt.md"], fallthrough = false }
]

[vars]
# Comma-separated list of allowed origins. Override per-environment as needed.
# Example: "https://wyattdave.github.io,http://localhost:5500"
ALLOWED_ORIGINS = "https://wyattdave.github.io,http://localhost:5500,http://127.0.0.1:5500"
# OpenRouter model id. Any "free" tier model works.
OPENROUTER_MODEL = "openrouter/free"
# Dev.to username used to seed the article context.
DEVTO_USERNAME = "wyattdave"
# Optional: surfaced in OpenRouter analytics (HTTP-Referer / X-Title).
SITE_URL   = "https://wyattdave.github.io"
SITE_TITLE = "WyattDave Portfolio Chatbot"

# OPENROUTER_API_KEY is bound from Cloudflare Secrets Store (see below).
# Read it in the Worker with: await env.OPENROUTER_API_KEY.get()

[[secrets_store_secrets]]
binding     = "OPENROUTER_API_KEY"
store_id    = "494d8b68c00f4d9aaf56066f25a83d08"
secret_name = "openrouter"

[env.production.vars]
ALLOWED_ORIGINS = "https://wyattdave.github.io"
OPENROUTER_MODEL = "meta-llama/llama-3.3-70b-instruct:free"
DEVTO_USERNAME = "wyattdave"
SITE_URL   = "https://wyattdave.github.io"
SITE_TITLE = "WyattDave Portfolio Chatbot"

[[env.production.secrets_store_secrets]]
binding     = "OPENROUTER_API_KEY"
store_id    = "494d8b68c00f4d9aaf56066f25a83d08"
secret_name = "openrouter"
